name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-safe:
    name: Public-safe tree
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No personal paths, private references or secrets in tracked files
        run: |
          pattern='([A-Z]:\\\\Users\\\\|/Users/[a-z]|/home/[a-z]|_handoffs|DevData|BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|sk-ant-|AKIA[0-9A-Z]{16})'
          if git grep -n -I -E "$pattern" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::private or secret-looking content in tracked files"
            exit 1
          fi
      - name: No build output tracked
        run: test -z "$(git ls-files bin)"

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/ci/package-lock.json
      - name: Build the helper with the C# compiler included in Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" -nologo -optimize -out:bin\dictate-key.exe helper\dictate-key.cs
          if ($LASTEXITCODE -ne 0) { throw 'helper build failed' }
      - name: The helper refuses anything but its fixed operations
        shell: pwsh
        run: |
          foreach ($arg in 'f9', 'calc.exe', '') {
            & .\bin\dictate-key.exe $arg
            if ($LASTEXITCODE -ne 64) { throw "argument '$arg' was not refused (exit $LASTEXITCODE)" }
          }
          & .\bin\dictate-key.exe mic
          if ($LASTEXITCODE -notin 10, 11, 12) { throw "mic query exit $LASTEXITCODE" }
          exit 0 # the checks above passed; the helper's own exit code is not the step's
      - name: Install Claude Code
        shell: pwsh
        run: |
          npm ci --prefix .github/ci --prefer-offline --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Claude Code install failed' }
          Join-Path $PWD '.github/ci/node_modules/.bin' | Out-File -Append $env:GITHUB_PATH
      - name: Plugin manifest and module validate
        run: claude plugin validate .
      - name: Plugin and installer tests
        shell: pwsh
        run: ./tests/ci.ps1
      - name: Build output stays untracked
        shell: pwsh
        run: if (git status --porcelain) { git status; throw 'working tree changed' }

  ci-ok:
    # The one check the branch ruleset requires from this workflow. Matrix job
    # names change when a version is added or dropped, and a required check
    # that no longer exists blocks every pull request; this name never changes.
    name: ci-ok
    if: always()
    needs: [public-safe, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
