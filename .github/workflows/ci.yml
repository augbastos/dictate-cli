# CI profile: public
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  safety:
    name: Safety
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout safety policy from the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-policy
          sparse-checkout: .github/scripts
          persist-credentials: false

      # One-time bootstrap: this migration's base has no safety.sh yet.
      # Only then use the PR copy; subsequent PRs always execute the base copy.
      - name: Bootstrap safety policy from the PR
        if: hashFiles('base-policy/.github/scripts/safety.sh') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: bootstrap-policy
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Checkout PR history for secret scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Check secrets and critical effects
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
          PR_DIR: ${{ github.workspace }}/pr
        run: |
          if [ -f base-policy/.github/scripts/safety.sh ]; then
            bash base-policy/.github/scripts/safety.sh
          else
            echo 'One-time bootstrap: safety.sh is absent from the base; running the PR copy.'
            bash bootstrap-policy/.github/scripts/safety.sh
          fi

  public-safe:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No personal paths, private references or secrets in tracked files
        run: |
          pattern='([A-Z]:\\\\Users\\\\|/Users/[a-z]|/home/[a-z]|_handoffs|DevData|BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|sk-ant-|AKIA[0-9A-Z]{16})'
          if git grep -n -I -E "$pattern" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::private or secret-looking content in tracked files"
            exit 1
          fi
      - name: No build output tracked
        run: test -z "$(git ls-files bin)"

  windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/ci/package-lock.json
      - name: Build the helper with the C# compiler included in Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" -nologo -optimize -out:bin\dictate-key.exe helper\dictate-key.cs
          if ($LASTEXITCODE -ne 0) { throw 'helper build failed' }
      - name: The helper refuses anything but its fixed operations
        shell: pwsh
        run: |
          foreach ($arg in 'f9', 'calc.exe', '') {
            & .\bin\dictate-key.exe $arg
            if ($LASTEXITCODE -ne 64) { throw "argument '$arg' was not refused (exit $LASTEXITCODE)" }
          }
          & .\bin\dictate-key.exe mic
          if ($LASTEXITCODE -notin 10, 11, 12) { throw "mic query exit $LASTEXITCODE" }
          exit 0 # the checks above passed; the helper's own exit code is not the step's
      - name: Install Claude Code
        shell: pwsh
        run: |
          npm ci --prefix .github/ci --prefer-offline --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Claude Code install failed' }
          Join-Path $PWD '.github/ci/node_modules/.bin' | Out-File -Append $env:GITHUB_PATH
      - name: Plugin manifest and module validate
        run: claude plugin validate .
      - name: Plugin and installer tests
        shell: pwsh
        run: ./tests/ci.ps1
      - name: Build output stays untracked
        shell: pwsh
        run: if (git status --porcelain) { git status; throw 'working tree changed' }

  ci-passed:
    name: CI passed
    if: always()
    needs: [safety, public-safe, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT_NAME" '
            to_entries | all(.value.result == "success" or
              (.key == "safety" and .value.result == "skipped" and $event != "pull_request"))
          ' <<< "$NEEDS_JSON"
